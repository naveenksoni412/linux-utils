monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.usb-DSEA_A_S_EPOS_BTD_800_III_A004421243704717_9cf255ec-00"
      }
      { device.name = "~.*EPOS.*" }
      { device.nick = "~.*EPOS.*" }
    ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
        device.profile.auto = false
        session.suspend-on-idle = false
      }
    }
  }
]
