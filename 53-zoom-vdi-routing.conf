monitor.alsa.rules = [
  {
    matches = [
      {
        # Matches any stream from the Zoom VDI engine
        # We use node.name because it's what WirePlumber sees for streams
        node.name = "~ZOOM VoiceEngine*"
      }
    ]
    actions = {
      update-props = {
        # Force the stream to your EPOS Pro Audio Sink
        target.object = "alsa_output.usb-DSEA_A_S_EPOS_BTD_800_III_A004421243704717_9cf255ec-00.pro-output-0"
        # Prevent WirePlumber from moving it back to 'Default' (HDMI/Headphones)
        node.dont-fallback = true
      }
    }
  }
]
